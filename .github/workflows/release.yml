name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Release Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Type check
        run: bun run type-check

      - name: Lint
        run: bun run lint

      - name: Run tests
        run: bun run test

      - name: Generate changelog
        run: bunx changelogithub
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update npm
        run: npm install -g npm@latest

      # `bun pm pack` (not `npm pack`) is load-bearing: it rewrites the `workspace:*` ranges in
      # each manifest to the concrete version being released. npm has no idea what that protocol
      # means and would publish it verbatim, breaking every consumer's install.
      #
      # `@graphx/admin` is `"private": true` — it is the operator SPA, not a library. `bun pm pack`
      # packs it happily, so the private check has to be explicit here or `npm publish` aborts the
      # whole loop on the first (alphabetically first!) directory.
      #
      # No `--provenance`: npm only issues an attestation for a build in a PUBLIC repository, and
      # this one is private. Add the flag (the `id-token: write` permission above is already there
      # for it) if and when the repository goes public.
      - name: Publish packages to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for dir in packages/*/; do
            if [ "$(node -p "require('./$dir/package.json').private === true")" = "true" ]; then
              echo "skip $dir — private"
              continue
            fi
            (cd "$dir" && bun pm pack && npm publish ./*.tgz --access public)
          done
