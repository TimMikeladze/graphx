name: CI

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (libSQL)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # The published CLI runs on Node; test/cli/node.test.ts drives the built binary with it.
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # bql.sh's pinned libsqlite3, so the native-fork tests (test/core/fork-bql.test.ts) run
      # instead of skipping. Downloads the SQLite amalgamation, checks its hash, and compiles it.
      - name: Build bql.sh's libsqlite3
        run: bun run bql:build

      - name: Build
        run: bun run build

      - name: Type check
        run: bun run type-check

      - name: Lint
        run: bun run lint

      - name: Run tests
        run: bun run test

      # site/ is not a workspace — it has its own lockfile, so it installs and tests on its own.
      - name: Site tests
        working-directory: site
        run: |
          bun install --frozen-lockfile
          bun test

  # Postgres backend — the same suite under GRAPHX_TEST_DRIVER=postgres against a
  # pgvector service container.
  test-postgres:
    name: Test (Postgres)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: graphx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      GRAPHX_TEST_DRIVER: postgres
      GRAPHX_TEST_PG_URL: postgresql://postgres:postgres@localhost:5432/graphx_test

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Required, not optional: the `graphx mcp` bin test spawns `dist/cli.js`, and the
      # examples import `graphx` by name — which resolves through the `exports` map into
      # `./dist`. Both fail without a build.
      - name: Build
        run: bun run build

      # The test harness also runs CREATE EXTENSION (ensureExtension: true); this makes
      # the pgvector prerequisite explicit and independent of test-time privileges.
      - name: Create pgvector extension
        run: PGPASSWORD=postgres psql -h localhost -U postgres -d graphx_test -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Run tests (Postgres)
        run: bun run test

  # DuckDB backend — the same suite under GRAPHX_TEST_DRIVER=duckdb. No service container:
  # DuckDB is an in-process/local-file engine.
  test-duckdb:
    name: Test (DuckDB)
    runs-on: ubuntu-latest

    env:
      GRAPHX_TEST_DRIVER: duckdb

    # Full-text/hybrid retrieval and p14-concurrency are closed.
    # The two raw-SQL constraint-enforcement probes that DuckDB structurally cannot satisfy —
    # it has no partial UNIQUE index, so `duck-constraints.ts` enforces the same rules in
    # application code instead — are gated by the `indexBackedConstraints` harness helper
    # rather than left failing, so this job is a real gate (no continue-on-error).

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Required, not optional: the `graphx mcp` bin test spawns `dist/cli.js`, and the
      # examples import `graphx` by name — which resolves through the `exports` map into
      # `./dist`. Both fail without a build.
      - name: Build
        run: bun run build

      - name: Run tests (DuckDB)
        run: bun run test

  # bql.sh backend — the same suite under GRAPHX_TEST_DRIVER=bql against an embedded bql.sh
  # server this job starts itself. Forks between two databases on it take the native path.
  test-bql:
    name: Test (bql.sh)
    runs-on: ubuntu-latest

    env:
      GRAPHX_TEST_DRIVER: bql

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build bql.sh's libsqlite3
        run: bun run bql:build

      # Required, not optional: the `graphx mcp` bin test spawns `dist/cli.js`, and the
      # examples import `graphx` by name — which resolves through the `exports` map into
      # `./dist`. Both fail without a build.
      - name: Build
        run: bun run build

      # Writes GRAPHX_BQL_URL and GRAPHX_BQL_TOKEN to $GITHUB_ENV, then keeps serving.
      - name: Start bql.sh
        run: |
          nohup bun scripts/bql-server.ts --env-file "$GITHUB_ENV" > bql-server.log 2>&1 &
          for i in $(seq 1 60); do grep -q GRAPHX_BQL_URL "$GITHUB_ENV" && exit 0; sleep 1; done
          cat bql-server.log
          exit 1

      - name: Run tests (bql.sh)
        run: bun run test
