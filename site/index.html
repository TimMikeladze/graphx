<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>graphx</title>
		<meta name="description" content="" />
		<link rel="canonical" href="https://graphx.sh/" />

		<!--
		  Title and description are filled in from the README at build time (see
		  vite.config.ts); everything below is constant.

		  The card image is generated at build time from the README too (og/card.ts)
		  and emitted at /og.png — nothing is committed. It must stay 1200x630 and
		  absolute: LinkedIn ignores relative URLs, and both it and X drop cards
		  whose declared dimensions do not match the file.
		-->
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="graphx" />
		<meta property="og:url" content="https://graphx.sh/" />
		<meta property="og:title" content="graphx" />
		<meta property="og:description" content="" />
		<meta property="og:image" content="https://graphx.sh/og.png" />
		<meta property="og:image:type" content="image/png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta
			property="og:image:alt"
			content="graphx — temporal GraphRAG on libSQL, Postgres or DuckDB, beside a schema defined with Zod and a bitemporal history read."
		/>

		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:site" content="@linesofcode" />
		<meta name="twitter:creator" content="@linesofcode" />
		<meta name="twitter:image" content="https://graphx.sh/og.png" />

		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />

		<script>
			// Apply the saved theme before first paint so there is no flash.
			try {
				const saved = localStorage.getItem('theme');
				if (saved === 'light' || saved === 'dark') {
					document.documentElement.dataset.theme = saved;
				}
			} catch {}
		</script>
	</head>
	<body>
		<div id="app"><!--app-html--></div>
		<script type="module" src="/src/main.ts"></script>
	</body>
</html>
