<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
	<!-- The nav mark at favicon scale: a closed triad — three nodes, three edges.
	     `currentcolor` is not available to a linked icon, so the ink follows the
	     OS theme through a media query instead. -->
	<style>
		.ink { stroke: #171717; fill: #171717; }
		@media (prefers-color-scheme: dark) { .ink { stroke: #ffffff; fill: #ffffff; } }
	</style>
	<g class="ink" stroke-width="1.3" stroke-linejoin="round">
		<path d="M3.4 10.8 9 3.6l3.6 8Z" fill="none" />
		<circle cx="3.4" cy="10.8" r="2.1" stroke="none" />
		<circle cx="9" cy="3.6" r="1.6" stroke="none" />
		<circle cx="12.6" cy="11.6" r="1.6" stroke="none" />
	</g>
</svg>
