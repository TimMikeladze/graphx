name: CI

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (libSQL)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Type check
        run: bun run type-check

      - name: Lint
        run: bun run lint

      - name: Run tests
        run: bun run test

  # Postgres backend — the same suite under GRAPHX_TEST_DRIVER=postgres against a
  # pgvector service container.
  test-postgres:
    name: Test (Postgres)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: graphx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      GRAPHX_TEST_DRIVER: postgres
      GRAPHX_TEST_PG_URL: postgresql://postgres:postgres@localhost:5432/graphx_test

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Required, not optional: every `@graphx/*` package resolves through `./dist` (see the
      # `exports` map), so tests importing a workspace package by name — rather than by a
      # relative `src/` path — fail with "Cannot find module '@graphx/core'" without this.
      - name: Build
        run: bun run build

      # The test harness also runs CREATE EXTENSION (ensureExtension: true); this makes
      # the pgvector prerequisite explicit and independent of test-time privileges.
      - name: Create pgvector extension
        run: PGPASSWORD=postgres psql -h localhost -U postgres -d graphx_test -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Run tests (Postgres)
        run: bun run test

  # DuckDB backend — the same suite under GRAPHX_TEST_DRIVER=duckdb. No service container:
  # DuckDB is an in-process/local-file engine.
  test-duckdb:
    name: Test (DuckDB)
    runs-on: ubuntu-latest

    env:
      GRAPHX_TEST_DRIVER: duckdb

    # Full-text/hybrid retrieval and p14-concurrency are closed (see docs/DUCKDB_SUPPORT.md).
    # Two failures remain permanently by design: raw-SQL constraint-enforcement bypasses that
    # only libSQL/Postgres reject via a partial index DuckDB has no equivalent of. `bun run
    # test` has no mechanism to exclude specific tests, so this job cannot go green without
    # such a filter. Remove continue-on-error only once one exists (or the two tests are
    # otherwise excluded) and the job genuinely passes.
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Required, not optional: every `@graphx/*` package resolves through `./dist` (see the
      # `exports` map), so tests importing a workspace package by name — rather than by a
      # relative `src/` path — fail with "Cannot find module '@graphx/core'" without this.
      - name: Build
        run: bun run build

      - name: Run tests (DuckDB)
        run: bun run test
