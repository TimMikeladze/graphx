<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Anime Graph Explorer</title>
		<meta
			name="description"
			content="Explore 41k anime as a graph: click any node to expand its franchise, studios and tags."
		/>
		<style>
			:root {
				--bg: #fbfaf8;
				--fg: #1d1b19;
				--muted: #6f6a64;
				--line: #e6e2dc;
				--card: #fff;
				--accent: #c2410c;
				--anime: #c2410c;
				--studio: #2563eb;
				--producer: #7c3aed;
				--tag: #0d9488;
			}
			@media (prefers-color-scheme: dark) {
				:root {
					--bg: #141312;
					--fg: #ece8e3;
					--muted: #9b958e;
					--line: #2c2a27;
					--card: #1c1a18;
					--accent: #fb923c;
					--anime: #fb923c;
					--studio: #60a5fa;
					--producer: #a78bfa;
					--tag: #2dd4bf;
				}
			}
			* {
				box-sizing: border-box;
			}
			html,
			body {
				margin: 0;
				height: 100%;
				background: var(--bg);
				color: var(--fg);
				font:
					14px/1.4 ui-sans-serif,
					system-ui,
					sans-serif;
				overflow: hidden;
			}
			#graph {
				position: absolute;
				inset: 0;
			}
			.bar {
				position: absolute;
				top: 12px;
				left: 12px;
				right: 12px;
				display: flex;
				gap: 8px;
				align-items: center;
				flex-wrap: wrap;
				pointer-events: none;
			}
			.bar > * {
				pointer-events: auto;
			}
			.bar a.home {
				font-weight: 700;
				color: var(--fg);
				text-decoration: none;
				background: var(--card);
				border: 1px solid var(--line);
				border-radius: 8px;
				padding: 7px 10px;
			}
			.bar form {
				display: flex;
				gap: 6px;
				flex: 1;
				min-width: 200px;
				max-width: 420px;
			}
			.bar input {
				flex: 1;
				min-width: 0;
				font: inherit;
				padding: 7px 10px;
				border: 1px solid var(--line);
				border-radius: 8px;
				background: var(--card);
				color: var(--fg);
			}
			.bar button,
			.btn {
				font: inherit;
				padding: 7px 10px;
				border-radius: 8px;
				border: 1px solid var(--line);
				background: var(--card);
				color: var(--fg);
				cursor: pointer;
			}
			.legend {
				display: flex;
				gap: 10px;
				background: var(--card);
				border: 1px solid var(--line);
				border-radius: 8px;
				padding: 6px 10px;
				font-size: 12px;
				color: var(--muted);
			}
			.legend i {
				display: inline-block;
				width: 9px;
				height: 9px;
				border-radius: 50%;
				margin-right: 4px;
				vertical-align: -1px;
			}
			#panel {
				position: absolute;
				right: 12px;
				bottom: 12px;
				width: 280px;
				max-width: calc(100% - 24px);
				background: var(--card);
				border: 1px solid var(--line);
				border-radius: 10px;
				padding: 12px;
				display: none;
			}
			#panel img {
				width: 64px;
				border-radius: 6px;
				float: left;
				margin-right: 10px;
			}
			#panel h3 {
				margin: 0 0 2px;
				font-size: 14px;
			}
			#panel .m {
				color: var(--muted);
				font-size: 12px;
			}
			#panel .acts {
				clear: both;
				display: flex;
				gap: 6px;
				padding-top: 10px;
			}
			#panel .acts a {
				font-size: 12px;
			}
			#status {
				position: absolute;
				left: 12px;
				bottom: 12px;
				color: var(--muted);
				font-size: 12px;
				background: var(--card);
				border: 1px solid var(--line);
				border-radius: 8px;
				padding: 5px 8px;
			}
			#results {
				position: absolute;
				top: 56px;
				left: 12px;
				width: 360px;
				max-width: calc(100% - 24px);
				background: var(--card);
				border: 1px solid var(--line);
				border-radius: 10px;
				display: none;
				max-height: 50vh;
				overflow: auto;
			}
			#results div {
				padding: 8px 10px;
				cursor: pointer;
				border-bottom: 1px solid var(--line);
			}
			#results div:hover {
				background: color-mix(in srgb, var(--accent) 10%, transparent);
			}
		</style>
	</head>
	<body>
		<div id="graph"></div>
		<div class="bar">
			<a class="home" href="/">Anime Graph</a>
			<form id="f">
				<input
					id="q"
					placeholder="Start from a title…"
					aria-label="Find a title to start from"
				/><button>Go</button>
			</form>
			<div class="legend">
				<span><i style="background: var(--anime)"></i>anime</span
				><span><i style="background: var(--studio)"></i>studio</span
				><span><i style="background: var(--producer)"></i>producer</span
				><span><i style="background: var(--tag)"></i>tag</span>
			</div>
			<button class="btn" id="reset">Clear</button>
		</div>
		<div id="results"></div>
		<div id="panel"></div>
		<div id="status">Click a node to expand it · drag to pan · scroll to zoom</div>
		<script src="https://unpkg.com/force-graph@1.52.0/dist/force-graph.min.js"></script>
		<script>
			const $ = (s) => document.querySelector(s);
			const esc = (s) =>
				String(s ?? '').replace(
					/[&<>"']/g,
					(c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c],
				);
			const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
			const color = (t) => css('--' + t) || css('--accent');

			const nodes = new Map(); // id -> node
			const links = new Map(); // "src|dst|rel" -> link
			const expanded = new Set();
			let hovered = null;
			const images = new Map();
			const img = (url) => {
				if (!url) return null;
				let i = images.get(url);
				if (!i) {
					i = new Image();
					i.src = url;
					images.set(url, i);
				}
				return i.complete && i.naturalWidth ? i : null;
			};

			const graph = ForceGraph()($('#graph'))
				.backgroundColor(css('--bg'))
				.nodeId('id')
				.linkColor(() => css('--line'))
				.linkWidth((l) => (l.rel === 'relatedTo' ? 1.5 : 0.8))
				.linkDirectionalParticles(0)
				.nodeRelSize(4)
				.nodeVal((n) => (n.type === 'anime' ? 3 : 2))
				.nodeLabel((n) => esc(n.label) + (n.year ? ` (${n.year})` : ''))
				.nodeCanvasObject((n, ctx, scale) => {
					const r = n.type === 'anime' ? 9 : 6;
					const pic = n.type === 'anime' && img(n.thumbnail);
					ctx.save();
					ctx.beginPath();
					ctx.arc(n.x, n.y, r, 0, 2 * Math.PI);
					ctx.fillStyle = color(n.type);
					ctx.fill();
					if (pic) {
						ctx.clip();
						ctx.drawImage(pic, n.x - r, n.y - r * 1.3, r * 2, r * 2.6);
					}
					ctx.restore();
					ctx.beginPath();
					ctx.arc(n.x, n.y, r, 0, 2 * Math.PI);
					ctx.lineWidth = (expanded.has(n.id) ? 2.5 : 1.2) / Math.min(scale, 3);
					ctx.strokeStyle = expanded.has(n.id) ? css('--fg') : color(n.type);
					ctx.stroke();
					if (scale > 2.2 || expanded.has(n.id) || n === hovered) {
						const size = 11 / scale;
						ctx.font = `${n.type === 'anime' ? 600 : 400} ${size}px ui-sans-serif, system-ui`;
						ctx.textAlign = 'center';
						ctx.textBaseline = 'top';
						const label = n.label.length > 28 ? n.label.slice(0, 27) + '…' : n.label;
						ctx.fillStyle = css('--fg');
						ctx.fillText(label, n.x, n.y + r + 2 / scale);
					}
				})
				.nodePointerAreaPaint((n, c, ctx) => {
					ctx.fillStyle = c;
					ctx.beginPath();
					ctx.arc(n.x, n.y, n.type === 'anime' ? 10 : 7, 0, 2 * Math.PI);
					ctx.fill();
				})
				.onNodeHover((n) => {
					hovered = n;
					$('#graph').style.cursor = n ? 'pointer' : '';
				})
				.onNodeClick((n) => {
					showPanel(n);
					expand(n.id);
				})
				.cooldownTicks(120);
			graph.d3Force('charge').strength(-90);
			graph.d3Force('link').distance((l) => (l.rel === 'relatedTo' ? 40 : 70));

			function refresh() {
				graph.graphData({ nodes: [...nodes.values()], links: [...links.values()] });
			}

			async function expand(id) {
				if (expanded.has(id)) return;
				expanded.add(id);
				$('#status').textContent = 'Expanding…';
				try {
					const r = await fetch('/api/graph/' + id).then((x) => x.json());
					const origin = nodes.get(id);
					for (const n of r.nodes) {
						if (!nodes.has(n.id))
							nodes.set(
								n.id,
								origin
									? {
											...n,
											x: origin.x + (Math.random() - 0.5) * 30,
											y: origin.y + (Math.random() - 0.5) * 30,
										}
									: n,
							);
					}
					for (const l of r.links) {
						const k = l.source + '|' + l.target + '|' + l.rel;
						if (!links.has(k)) links.set(k, l);
					}
					refresh();
					$('#status').textContent =
						`${nodes.size} nodes · ${links.size} edges · ${expanded.size} expanded — click any node to keep going`;
					history.replaceState(null, '', '#' + [...expanded].join(','));
				} catch (e) {
					expanded.delete(id);
					$('#status').textContent = 'Error: ' + e.message;
				}
			}

			function showPanel(n) {
				const p = $('#panel');
				p.style.display = 'block';
				p.innerHTML = `${n.thumbnail ? `<img src="${esc(n.thumbnail)}" alt="">` : ''}<h3>${esc(n.label)}</h3>
		<div class="m">${esc(n.type)}${n.year ? ' · ' + n.year : ''}${n.score ? ' · ★ ' + n.score.toFixed(2) : ''}</div>
		<div class="acts">${n.type === 'anime' ? `<a href="/#/anime/${n.id}">Details &amp; similar →</a>` : ''}
		<a href="#" id="focus">Center</a></div>`;
				$('#focus').onclick = (e) => {
					e.preventDefault();
					graph.centerAt(n.x, n.y, 600);
					graph.zoom(3, 600);
				};
			}

			async function start(id) {
				nodes.clear();
				links.clear();
				expanded.clear();
				refresh();
				await expand(id);
				setTimeout(() => graph.zoomToFit(600, 60), 900);
			}

			$('#f').onsubmit = async (e) => {
				e.preventDefault();
				const q = $('#q').value.trim();
				if (!q) return;
				const box = $('#results');
				box.style.display = 'block';
				box.innerHTML = '<div>Searching…</div>';
				const r = await fetch('/api/search?q=' + encodeURIComponent(q)).then((x) => x.json());
				box.innerHTML =
					r.results
						.map(
							(a) =>
								`<div data-id="${a.id}">${esc(a.title)} <span style="color:var(--muted)">${esc(a.type)}${a.year ? ' · ' + a.year : ''}</span></div>`,
						)
						.join('') || '<div>No results</div>';
				box.querySelectorAll('[data-id]').forEach(
					(d) =>
						(d.onclick = () => {
							box.style.display = 'none';
							start(d.dataset.id);
						}),
				);
			};
			$('#reset').onclick = () => {
				nodes.clear();
				links.clear();
				expanded.clear();
				refresh();
				$('#panel').style.display = 'none';
				history.replaceState(null, '', '#');
			};
			// For the console: explorer.expand(id), explorer.nodes, explorer.graph.
			window.explorer = { graph, nodes, expand };
			window.addEventListener('resize', () => graph.width(innerWidth).height(innerHeight));

			// Start from the ids in the hash (a shared exploration), else from Kidou Senshi Gundam.
			(async () => {
				const ids = location.hash
					.slice(1)
					.split(',')
					.filter((s) => /^[0-9A-Z]{26}$/.test(s));
				if (ids.length) {
					for (const id of ids) await expand(id);
					setTimeout(() => graph.zoomToFit(600, 60), 900);
					return;
				}
				const r = await fetch('/api/title?t=' + encodeURIComponent('Kidou Senshi Gundam')).then(
					(x) => x.json(),
				);
				const first = r.results[0];
				if (first) start(first.id);
			})();
		</script>
	</body>
</html>
